<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project 3 Interactive Visualization</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>EV Market Inflation from 2020-2026</h1>
      <h2>EV Market Research Group</h2>
      <p>Members: Gloria Kao, Neeraja Upasani, Lucia Si, Benjamin Ly</p>
    </header>

    <main>
      <h2>When was the best time to invest in an electric vehicle?</h2>

      <div class="dropdown-filter">
        <details class="multi" id="brand-menu">
          <summary>Brand: All</summary>
          <div class="options"></div>
        </details>

        <details class="multi" id="tier-menu">
          <summary>Tier: All</summary>
          <div class="options"></div>
        </details>
      </div>

      <figure class = "line-container">
        <svg
          id="line-chart"
          viewBox="0 0 700 400"
          role="img"
          aria-label="Line graph comparing brand and price inflation"
        ></svg>
        <div id="legend"></div>
        <figcaption>Caption goes here...</figcaption>
      </figure>

      <section>
        <h3>Writeup</h3>
        <p>Writeup goes here...</p>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="global.js"></script>
  </body>
</html>
