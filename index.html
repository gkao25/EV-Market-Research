<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project 3 Interactive Visualization</title>
    <link rel="stylesheet" href="style.css" />
    <script src="global.js" type="module"></script>
  </head>
  <body>
    <header>
      <h1>EV Market Inflation from 2020-2026</h1>
      <h2>EV Market Research Group</h2>
      <p>Members: Gloria Kao, Neeraja Upasani, Lucia Si, Benjamin Ly</p>
    </header>

    <main>
      <h2>Which electric vehicle brand has the highest price inflation?</h2>

      <div class="dropdown-filter">

        <div class = "fliter-options">
          <details class="multi" id="brand-menu">
            <summary>Brand: All</summary>
            <div class="options"></div>
          </details>

          <details class="multi" id="tier-menu">
            <summary>Tier: All</summary>
            <div class="options"></div>
          </details>

        </div>

        <p class = "select-caption">
          Select multiple brands and tiers to compare EV prices.
        </p>
        

      </div>

      <figure class="line-container">
        <svg
          id="line-chart"
          viewBox="0 0 600 400"
          role="img"
          aria-label="Line graph comparing brand and price inflation"
        ></svg>
        <div id="legend"></div>
        <p class="legend-hint">Click a legend item to hide or show its line.</p>
        <figcaption>
          Electrical vehicle prices over the years. Select one or multiple
          brands, and even tiers (luxury level), to compare their prices.
        </figcaption>
      </figure>

      <section>
        <h3>Writeup</h3>
        <p>Writeup goes here...</p>
      </section>
    </main>
  </body>
</html>
